name: CI/CD

on:
  push:
    branches:
      - main

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push user-service
        uses: docker/build-push-action@v6
        with:
          context: ./user-service
          file: ./user-service/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/user-service:${{ github.sha }}

      - name: Build & Push learning-service
        uses: docker/build-push-action@v6
        with:
          context: ./learning-service
          file: ./learning-service/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/learning-service:${{ github.sha }}

      - name: Build & Push api-gateway
        uses: docker/build-push-action@v6
        with:
          context: ./api-gateway
          file: ./api-gateway/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/api-gateway:${{ github.sha }}

      - name: Build & Push eureka-server
        uses: docker/build-push-action@v6
        with:
          context: ./eureka-server
          file: ./eureka-server/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/eureka-server:${{ github.sha }}

      - name: Build & Push cloudinary-service
        uses: docker/build-push-action@v6
        with:
          context: ./cloudinary-service
          file: ./cloudinary-service/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/cloudinary-service:${{ github.sha }}

  deploy:
    needs: docker
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            cd ~/lexiflow

            export IMAGE_TAG=${{ github.sha }}
            export DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}

            echo "Deploying version: $IMAGE_TAG"

            docker compose down

            docker compose pull

            docker compose up -d --force-recreate

            docker compose ps

            docker image prune -f
