name: CI

on:
  push:
    branches:
      - main

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push user-service
        uses: docker/build-push-action@v6
        with:
          context: ./backend/user-service
          file: ./backend/user-service/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/user-service:latest

      - name: Build & Push learning-service
        uses: docker/build-push-action@v6
        with:
          context: ./backend/learning-service
          file: ./backend/learning-service/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/learning-service:latest

      - name: Build & Push api-gateway
        uses: docker/build-push-action@v6
        with:
          context: ./backend/api-gateway
          file: ./backend/api-gateway/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/api-gateway:latest

      - name: Build & Push eureka-server
        uses: docker/build-push-action@v6
        with:
          context: ./backend/eureka-server
          file: ./backend/eureka-server/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/eureka-server:latest

      - name: Build & Push cloudinary-service
        uses: docker/build-push-action@v6
        with:
          context: ./backend/cloudinary-service
          file: ./backend/cloudinary-service/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/cloudinary-service:latest
