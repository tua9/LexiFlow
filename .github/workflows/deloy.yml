name: CI/CD

on:
  push:
    branches:
      - main

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push user-service
        uses: docker/build-push-action@v6
        with:
          context: ./backend/user-service
          file: ./backend/user-service/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/user-service:${{ github.sha }}

      - name: Build & Push learning-service
        uses: docker/build-push-action@v6
        with:
          context: ./backend/learning-service
          file: ./backend/learning-service/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/learning-service:${{ github.sha }}

      - name: Build & Push api-gateway
        uses: docker/build-push-action@v6
        with:
          context: ./backend/api-gateway
          file: ./backend/api-gateway/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/api-gateway:${{ github.sha }}

      - name: Build & Push eureka-server
        uses: docker/build-push-action@v6
        with:
          context: ./backend/eureka-server
          file: ./backend/eureka-server/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/eureka-server:${{ github.sha }}

      - name: Build & Push cloudinary-service
        uses: docker/build-push-action@v6
        with:
          context: ./backend/cloudinary-service
          file: ./backend/cloudinary-service/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/cloudinary-service:${{ github.sha }}

  deploy:
    needs: docker
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            IMAGE_TAG=${{ github.sha }}
            DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}

            # Stop and remove all old containers
            docker stop $(docker ps -q) 2>/dev/null || true
            docker rm $(docker ps -aq) 2>/dev/null || true

            # Pull new images
            docker pull $DOCKER_USERNAME/user-service:$IMAGE_TAG
            docker pull $DOCKER_USERNAME/learning-service:$IMAGE_TAG
            docker pull $DOCKER_USERNAME/api-gateway:$IMAGE_TAG
            docker pull $DOCKER_USERNAME/eureka-server:$IMAGE_TAG
            docker pull $DOCKER_USERNAME/cloudinary-service:$IMAGE_TAG

            # Run new containers
            docker run -d --name eureka-server \
              $DOCKER_USERNAME/eureka-server:$IMAGE_TAG

            docker run -d --name user-service \
              $DOCKER_USERNAME/user-service:$IMAGE_TAG

            docker run -d --name learning-service \
              $DOCKER_USERNAME/learning-service:$IMAGE_TAG

            docker run -d --name cloudinary-service \
              $DOCKER_USERNAME/cloudinary-service:$IMAGE_TAG

            docker run -d --name api-gateway \
              $DOCKER_USERNAME/api-gateway:$IMAGE_TAG

            # Remove unused images
            docker image prune -f
