name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push user-service
        uses: docker/build-push-action@v6
        with:
          context: ./user-service
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/user-service:latest

      - name: Build & Push learning-service
        uses: docker/build-push-action@v6
        with:
          context: ./learning-service
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/learning-service:latest

      - name: Build & Push api-gateway
        uses: docker/build-push-action@v6
        with:
          context: ./api-gateway
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/api-gateway:latest

      - name: Build & Push eureka-server
        uses: docker/build-push-action@v6
        with:
          context: ./eureka-server
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/eureka-server:latest

      - name: Build & Push cloudinary-service
        uses: docker/build-push-action@v6
        with:
          context: ./cloudinary-service
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/cloudinary-service:latest
