server:
  port: 2222

spring:
  application:
    name: api-gateway

  profiles:
    active: local

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://keycloak-production-85d0.up.railway.app/realms/myrealm

  cloud:
    gateway:
      routes:
        - id: cloudinary-service
          uri: lb://cloudinary-service
          predicates:
            - Path=/cloudinary/**

        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/v1/users/**,/api/v1/roles/**, /api/v1/test-results/**

        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/public/auth/**

        - id: learning-service
          uri: lb://learning-service
          predicates:
            - Path=/api/v1/topics/**, /api/v1/vocabularies/**, /api/v1/daily-task-groups/**, /api/v1/tasks/**

    discovery:
      locator:
        enabled: true
        lower-case-service-id: true

eureka:
  client:
    registry-fetch-interval-seconds: 5

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.cloud.loadbalancer: DEBUG
