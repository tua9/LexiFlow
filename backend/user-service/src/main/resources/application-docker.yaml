server:
  port: 1002

spring:
  datasource:
    url: jdbc:postgresql://user-db:5432/user-service
    username: postgres
    password: 123456

  security:
    oauth2:
      resource-server:
        jwt:
          issuer-uri: ${keycloak.server-url}/realms/master

